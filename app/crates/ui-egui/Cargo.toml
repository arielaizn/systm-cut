[package]
name = "systmcut-ui-egui"
description = "The SYSTM Cut egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# SYSTM Cut Photo page: the PhotoCraft engine (MIT or Apache-2.0), as libraries; the page's interface is ours
photocraft-engine = { path = "../../../photo-engine/crates/engine" }
photocraft-compose = { path = "../../../photo-engine/crates/compose" }
photocraft-doc = { path = "../../../photo-engine/crates/doc" }
photocraft-color = { path = "../../../photo-engine/crates/color" }
photocraft-geom = { path = "../../../photo-engine/crates/geom" }
craft-ui = { workspace = true }
systmcut-time = { workspace = true }
systmcut-geom = { workspace = true }
systmcut-color = { workspace = true }
systmcut-frame = { workspace = true }
systmcut-media = { workspace = true }
systmcut-project = { workspace = true }
systmcut-tts = { workspace = true }
systmcut-edit = { workspace = true }
systmcut-render = { workspace = true }
systmcut-text = { workspace = true }
systmcut-captions = { workspace = true }
systmcut-audio-dsp = { workspace = true }
systmcut-engine = { workspace = true }
systmcut-export = { workspace = true }
systmcut-gpu = { workspace = true }
systmcut-scopes = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = "1"
# Unicode Bidirectional Algorithm for Arabic and Hebrew captions in reading order (MIT OR Apache-2.0).
unicode-bidi = "0.3.18"
# ArtCraft wordmark (PNG) for the About dialog and Home screen.
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[dev-dependencies]
pollster = "1"
systmcut-audio-dsp = { workspace = true, features = ["test-util"] }
systmcut-codecs = { workspace = true }
# the bench registers OS hardware decoders as the desktop app does (dev-dependency only: ui-egui
# itself stays OS-independent and web-portable)
systmcut-platform = { workspace = true }
systmcut-interchange = { workspace = true }
# A dependency's dev-dependencies do not propagate through egui_kittest: name the fonts this
# test root needs explicitly so glyph and accessibility assertions run against the bundled faces.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
tempfile = "3"

# build.rs bakes contributors/contributors.json into the binary (About ▸ Contributors).
[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }
