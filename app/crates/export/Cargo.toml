[package]
name = "systmcut-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-audio = { workspace = true }
craft-video = { workspace = true }
systmcut-time = { workspace = true }
systmcut-frame = { workspace = true }
systmcut-color = { workspace = true }
systmcut-media = { workspace = true }
craft-media = { workspace = true, features = ["mxf"] }
systmcut-codecs = { workspace = true }
systmcut-project = { workspace = true }
systmcut-render = { workspace = true }
systmcut-audio-dsp = { workspace = true }
systmcut-geom = { workspace = true }
systmcut-text = { workspace = true }
systmcut-isobmff = { workspace = true }
systmcut-dnx = { workspace = true }
systmcut-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
systmcut-testkit = { workspace = true }
