[package]
name = "systmcut-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
systmcut-color = { workspace = true }
systmcut-frame = { workspace = true }
systmcut-geom = { workspace = true }
systmcut-project = { workspace = true }
systmcut-render = { workspace = true }
systmcut-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "1"
tempfile = "3"
rayon = { workspace = true }

[dev-dependencies]
pollster = "1"
tempfile = "3"
systmcut-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
systmcut-media = { workspace = true }
systmcut-time = { workspace = true }
