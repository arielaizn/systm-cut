[package]
name = "systmcut-cli"
description = "SYSTM Cut headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "systmcut-cli"
path = "src/main.rs"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["systmcut-engine/whisper", "systmcut-engine/speech-download"]

[dependencies]
systmcut-engine = { workspace = true }
systmcut-export = { workspace = true }
systmcut-project = { workspace = true }
systmcut-render = { workspace = true }
systmcut-time = { workspace = true }
systmcut-gpu = { workspace = true }
systmcut-media = { workspace = true }
systmcut-codecs = { workspace = true }
systmcut-platform = { workspace = true }
craft-media = { workspace = true, features = ["mpegts", "mxf", "ogg"] }
systmcut-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
systmcut-testkit = { workspace = true }
tempfile = "3"
