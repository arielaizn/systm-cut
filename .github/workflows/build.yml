name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cd app && cargo build --release -p systmcut -p systmcut-cli
      - run: packaging/package.sh --skip-build
      - uses: actions/upload-artifact@v4
        with:
          name: SYSTM-Cut-macos
          path: dist/*.dmg
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cd app; cargo build --release -p systmcut -p systmcut-cli
      - run: powershell -File packaging/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SYSTM-Cut-windows
          path: dist/*.zip
